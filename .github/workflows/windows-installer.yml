name: Windows installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Build app
        run: npm run build

      # Every build gets a higher version (0.2.<run number>) so installed copies see it as an update.
      - name: Set version
        shell: bash
        run: npm version "0.2.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Package Windows installer
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Rapport-Setup
          path: |
            dist/*.exe
            dist/latest.yml
          retention-days: 30

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          # The in-app updater reads latest.yml from the newest release and downloads the installer it names.
          tag_name: v0.2.${{ github.run_number }}
          name: Rapport 0.2.${{ github.run_number }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          make_latest: true
